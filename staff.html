<!doctype html><html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b2342"><meta name="description" content="QURANER ALO teacher and helper management"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xjysbpthosvjxzujmuhe.supabase.co;"><title>Teachers & Helpers | QURANER ALO</title><link rel="icon" type="image/jpeg" href="assets/quraner-alo-logo.jpg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="dashboard.css?v=20260918-2"></head>
<body><main class="dashboard-shell"><section class="card dashboard-card">
<div class="topbar"><div class="brand-mini"><img src="assets/quraner-alo-logo.jpg" width="58" height="58" alt="QURANER ALO logo"><div><strong>কোরআনের আলো</strong><span>Teachers & Helpers</span></div></div><div class="top-actions"><a class="secondary-btn" href="dashboard.html">Dashboard</a><button id="signOut" class="secondary-btn" type="button">Sign out</button></div></div>
<div id="loading" class="notice-box">Staff data load হচ্ছে…</div>
<div id="app" class="hidden"><div class="page-head"><div><p class="eyebrow">STAFF MANAGEMENT</p><h1>Teachers & Helpers</h1><p class="muted">Teacher ও helper records, joining information এবং portal access.</p></div></div>
<div class="panel"><div class="module-tabs"><button id="teachers" class="module-tab is-active" data-tab="teacher">Teachers</button><button id="helpers" class="module-tab" data-tab="helper">Helpers / Staff</button></div>
<form id="staffForm" class="form-grid" style="padding:16px"><input type="hidden" name="mode" value="teacher"><label>পূর্ণ নাম<input name="full_name" required></label><label>বাংলা নাম<input name="full_name_bn"></label><label>ফোন<input name="phone" inputmode="tel"></label><label>Email<input name="email" type="email"></label><label class="teacher-only">Specialization<input name="specialization" placeholder="Hifz / Tajweed / Nazera"></label><label>Joining date<input name="joining_date" type="date"></label><label class="helper-only hidden">Staff type<select name="staff_type"><option value="helper">Helper</option><option value="staff">Staff</option></select></label><label class="span-2">Notes<textarea name="notes"></textarea></label><div class="page-actions span-2"><button class="primary-btn" type="submit">Save record</button></div><p id="formMessage" class="message-inline span-2"></p></form></div>
<div class="panel"><div class="panel-head"><h2 id="listTitle">Teacher List</h2><span id="countLabel" class="eyebrow"></span></div><div class="table-wrap"><table class="user-table"><thead><tr><th>Code</th><th>Name</th><th>Phone</th><th>Email</th><th>Specialization / Type</th><th>Status</th><th>Portal</th><th>Portal Access</th></tr></thead><tbody id="staffRows"></tbody></table></div></div></div>
</section></main><script src="supabase-config.js"></script><script type="module" src="staff.js"></script><script src="management-nav.js?v=20260918-1"></script></body></html>
