<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2342"><title>Helper Profile | QURANER ALO</title><link rel="icon" type="image/jpeg" href="assets/quraner-alo-logo.jpg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="dashboard.css?v=20260918-5"><style>
.profile-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin:14px 0 20px}.profile-head h1{margin:0;font-size:30px}.profile-actions{display:flex;gap:10px;flex-wrap:wrap}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.profile-card{grid-column:1/-1;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}.profile-card-head{padding:13px 16px;background:#f5f9fe;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.profile-card-head h2{margin:0;color:var(--navy);font-size:18px}.profile-body{padding:16px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font:inherit}.badge{padding:5px 9px;border-radius:999px;background:#f3f5f8;color:var(--muted);font-size:12px;font-weight:700}.danger-btn{border:1px solid #b42318;background:#fff;color:#b42318;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}@media(max-width:720px){.profile-grid,.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><main class="dashboard-shell"><section class="card dashboard-card"><div class="topbar"><div class="brand-mini"><img src="assets/quraner-alo-logo.jpg" width="58" height="58" alt="QURANER ALO logo"><div><strong>কোরআনের আলো</strong><span>Helper Profile</span></div></div><div class="top-actions"><a class="secondary-btn" href="staff.html">Teachers & Helpers</a><button id="signOut" class="secondary-btn" type="button">Sign out</button></div></div><div id="loading" class="notice-box">Profile load হচ্ছে…</div><div id="errorBox" class="notice-box hidden"></div><div id="app" class="hidden"><div class="profile-head"><div><p class="eyebrow">TEACHER & HELPER PROFILE</p><h1 id="title">Profile</h1><p id="subtitle" class="muted">—</p></div><div class="profile-actions"><a class="secondary-btn" href="staff.html">← তালিকায় ফিরুন</a><button id="editBtn" class="primary-btn" type="button">Edit Profile</button></div></div><form id="form"><div class="profile-grid"><div class="profile-card"><div class="profile-card-head"><h2>Basic Information</h2><span id="modeBadge" class="badge">View mode</span></div><div class="profile-body"><div class="fields"><div class="field"><label>Teacher / Helper ID</label><input id="code" readonly></div><div class="field"><label>পূর্ণ নাম</label><input id="fullName" required></div><div class="field" id="bnWrap"><label>বাংলা নাম</label><input id="fullNameBn"></div><div class="field"><label>ফোন</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field" id="specialWrap"><label>Specialization</label><input id="specialization"></div><div class="field"><label>Joining date</label><input id="joiningDate" type="date"></div><div class="field"><label>Status</label><select id="active"><option value="true">Active</option><option value="false">Inactive</option></select></div><div class="field full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div></div></div></div></div><div class="profile-actions" style="justify-content:flex-end;margin-top:16px"><button id="cancelBtn" class="secondary-btn hidden" type="button">Cancel</button><button id="saveBtn" class="primary-btn hidden" type="submit">Save Changes</button><span id="message" class="message-inline"></span></div></form></div></section></main><script src="supabase-config.js"></script><script type="module" src="staff-profile.js?v=20260918-3"></script><script src="management-nav.js?v=20260918-4"></script></body></html>
