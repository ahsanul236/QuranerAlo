<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2342"><title>Teacher / Helper Profile | QURANER ALO</title><link rel="icon" type="image/jpeg" href="assets/quraner-alo-logo.jpg"><link rel="stylesheet" href="styles.css?v=20260919-1"><link rel="stylesheet" href="dashboard.css?v=20260919-5"><style>

ption></select></div><div class="field full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div></div></div></div><div class="profile-card">
