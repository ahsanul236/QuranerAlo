<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2342"><meta name="description" content="QURANER ALO student management"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xjysbpthosvjxzujmuhe.supabase.co;"><title>Students | QURANER ALO</title><link rel="icon" type="image/jpeg" href="assets/quraner-alo-logo.jpg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="dashboard.css"><style>
.page-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:12px 0 20px;flex-wrap:wrap}.page-head h1{font-size:32px}.tools{display:flex;gap:10px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{display:grid;gap:6px;font-weight:600;color:var(--navy2)}.form-grid input,.form-grid select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.form-grid .full{grid-column:1/-1}.toolbar{display:flex;gap:10px;margin:16px 0}.toolbar input{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit}.table-wrap{overflow:auto}.student-table{width:100%;border-collapse:collapse;min-width:980px}.student-table th,.student-table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}.student-table th{color:var(--muted);font-size:13px}.student-code{font-weight:700;color:var(--navy)}.hidden{display:none!important}@media(max-width:640px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.page-head h1{font-size:27px}}
</style></head>
<body><main class="dashboard-shell"><section class="card dashboard-card"><div class="topbar"><div class="brand-mini"><img src="assets/quraner-alo-logo.jpg" width="58" height="58" alt="QURANER ALO logo"><div><strong>কোরআনের আলো</strong><span>Student Management</span></div></div><div class="top-actions"><a class="secondary-btn" href="dashboard.html">Dashboard</a><button id="signOut" class="secondary-btn" type="button">Sign out</button></div></div>
<div id="loading" class="notice-box">Students load হচ্ছে…</div><div id="app" class="hidden"><div class="page-head"><div><p class="eyebrow">STUDENT MANAGEMENT</p><h1>শিক্ষার্থী ব্যবস্থাপনা</h1><p class="muted">Student profile, guardian এবং enrollment foundation.</p></div><div class="tools"><button id="newStudent" class="primary-btn" type="button">+ নতুন শিক্ষার্থী</button></div></div>
<div id="studentFormPanel" class="panel hidden"><div class="panel-head"><h2>নতুন শিক্ষার্থী</h2></div><form id="studentForm" class="form-grid" style="padding:16px"><label>পূর্ণ নাম<input name="full_name" required></label><label>বাংলা নাম<input name="full_name_bn"></label><label>লিঙ্গ<select name="gender"><option value="unspecified">নির্ধারিত নয়</option><option value="male">পুরুষ</option><option value="female">নারী</option><option value="other">অন্যান্য</option></select></label><label>জন্মতারিখ<input name="date_of_birth" type="date"></label><label>ফোন<input name="phone" inputmode="tel"></label><label>Email<input name="email" type="email"></label><label>ভর্তি তারিখ<input name="admission_date" type="date"></label><label>অবস্থা<select name="status"><option value="active">Active</option><option value="on_hold">On hold</option><option value="inactive">Inactive</option></select></label><label class="full">ঠিকানা<textarea name="address" rows="2"></textarea></label><label class="full">নোট<textarea name="notes" rows="2"></textarea></label><div class="tools full"><button class="primary-btn" type="submit">Save student</button><button id="cancelStudent" class="secondary-btn" type="button">Cancel</button></div></form></div>
<div class="panel"><div class="panel-head"><h2>শিক্ষার্থী তালিকা</h2><span id="countLabel" class="eyebrow"></span></div><div class="toolbar" style="padding:0 16px"><input id="search" placeholder="নাম / Student ID / ফোন দিয়ে খুঁজুন…"></div><div class="table-wrap"><table class="student-table"><thead><tr><th>Student ID</th><th>নাম</th><th>ফোন</th><th>ভর্তি</th><th>অবস্থা</th><th>Portal</th><th>Portal Access</th></tr></thead><tbody id="studentRows"></tbody></table></div></div>
<p id="message" class="footer-note" aria-live="polite"></p></div></section></main><script src="supabase-config.js"></script><script type="module" src="students.js"></script></body></html>
