<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2342"><meta name="description" content="QURANER ALO guardian management"><title>Guardians | QURANER ALO</title><link rel="icon" type="image/jpeg" href="assets/quraner-alo-logo.jpg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="dashboard.css"></head><body><main class="dashboard-shell"><section class="card dashboard-card"><div class="topbar"><div class="brand-mini"><img src="assets/quraner-alo-logo.jpg" width="58" height="58" alt="QURANER ALO logo"><div><strong>কোরআনের আলো</strong><span>Guardian Management</span></div></div><div class="top-actions"><a class="secondary-btn" href="dashboard.html">Dashboard</a><button id="signOut" class="secondary-btn" type="button">Sign out</button></div></div><div id="loading" class="notice-box">Guardian data load হচ্ছে…</div><div id="app" class="hidden"><div class="page-head"><div><p class="eyebrow">GUARDIAN MANAGEMENT</p><h1>Guardians & Student Links</h1><p class="muted">অভিভাবকের তথ্য, সম্পর্ক এবং কোন শিক্ষার্থীর সঙ্গে যুক্ত আছেন তা পরিচালনা করুন।</p></div></div><div class="panel"><form id="guardianForm" class="form-grid" style="padding:16px"><label>পূর্ণ নাম<input id="fullName" required></label><label>Relation<input id="relation" placeholder="Father / Mother / Guardian" required></label><label>Phone<input id="phone" inputmode="tel"></label><label>Email<input id="email" type="email"></label><label class="span-2">Address<textarea id="address"></textarea></label><div class="page-actions span-2"><button class="primary-btn" type="submit">Save Guardian</button><span id="formMessage" class="message-inline"></span></div></form></div><div class="panel"><div class="panel-head"><h2>Link Guardian to Student</h2><span id="linkPermission" class="eyebrow"></span></div><form id="linkForm" class="form-grid" style="padding:16px"><label>Guardian<select id="guardianSelect" required></select></label><label>Student<select id="studentSelect" required></select></label><label><span>Primary guardian</span><select id="isPrimary"><option value="true">Yes</option><option value="false">No</option></select></label><div class="page-actions"><button class="primary-btn" type="submit">Link Student</button></div><div id="linkMessage" class="message-inline span-2"></div></form></div><div class="panel"><div class="panel-head"><h2>Guardian List</h2><span id="countLabel" class="eyebrow"></span></div><div class="table-wrap"><table class="user-table"><thead><tr><th>Name</th><th>Relation</th><th>Phone</th><th>Email</th><th>Linked Students</th></tr></thead><tbody id="guardianRows"></tbody></table></div></div></div></section></main><script src="supabase-config.js"></script><script type="module" src="guardians.js"></script></body></html>
